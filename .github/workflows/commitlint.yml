name: Commit message lint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  GRAPHIFY_SKIP_HOOK: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
      - name: Enable declared pnpm via Corepack
        run: corepack enable && corepack install
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Identify trusted Pin Courier PR
        id: pin_courier
        run: node scripts/is-pin-courier-pr.cjs
      - name: Validate PR body
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'bot/') && steps.pin_courier.outputs.trusted != 'true' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm run lint:pr

      - name: Lint PR title
        if: ${{ github.event_name == 'pull_request' && steps.pin_courier.outputs.trusted != 'true' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm run lint:commit --verbose
      - name: Lint immutable PR commit range
        if: ${{ github.event_name == 'pull_request' && steps.pin_courier.outputs.trusted != 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          pnpm run lint:commit --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
