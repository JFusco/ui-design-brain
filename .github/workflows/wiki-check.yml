name: Wiki integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_bot:
        description: "Verify personal BOT_TOKEN ownership and repository access without writes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wiki-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@11.1.1 --activate

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate wiki and graph
        run: pnpm run wiki:check

  verify-bot:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_bot
    runs-on: ubuntu-latest
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.BOT_TOKEN }}
      EXPECTED_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Verify bot identity and repository access
        run: |
          test -n "$GH_TOKEN" || { echo '::error::BOT_TOKEN is required'; exit 1; }
          login="$(gh api user --jq '.login')"
          test "${login,,}" = "${EXPECTED_OWNER,,}" \
            || { echo "::error::BOT_TOKEN belongs to $login, expected $EXPECTED_OWNER"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push == true' | grep -qx true \
            || { echo '::error::BOT_TOKEN lacks repository push access'; exit 1; }
          echo "Verified BOT_TOKEN owner $login and push access to $GITHUB_REPOSITORY."
          echo "BOT_TOKEN belongs to $login and has push access to $GITHUB_REPOSITORY. No writes performed." >> "$GITHUB_STEP_SUMMARY"
