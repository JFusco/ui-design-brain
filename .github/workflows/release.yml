name: Release

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]

permissions:
  contents: write
  id-token: write

concurrency:
  group: ui-design-brain-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    if: >-
      github.repository == 'JFusco/ui-design-brain' &&
      github.event.repository.private == false &&
      vars.NPM_RELEASE_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify tested commit
        env:
          QUALITY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$QUALITY_HEAD_SHA"

      - name: Classify tested revision
        id: scope
        env:
          QUALITY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          substantive=false
          while IFS= read -r path; do
            case "$path" in
              wiki/*|scripts/graph/data/graph.json) ;;
              *) substantive=true ;;
            esac
          done < <(git diff --name-only "${QUALITY_HEAD_SHA}^1" "$QUALITY_HEAD_SHA")
          echo "substantive=$substantive" >> "$GITHUB_OUTPUT"
          if [ "$substantive" != true ]; then
            echo 'Wiki-only revisions are ineligible for release.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node
        if: steps.scope.outputs.substantive == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Enable pnpm via Corepack
        if: steps.scope.outputs.substantive == 'true'
        run: corepack enable && corepack prepare pnpm@11.1.1 --activate

      - name: Get pnpm store path
        if: steps.scope.outputs.substantive == 'true'
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        if: steps.scope.outputs.substantive == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: steps.scope.outputs.substantive == 'true'
        run: pnpm install --frozen-lockfile

      - name: Reject aggregated breaking-change bodies
        if: steps.scope.outputs.substantive == 'true'
        run: pnpm release:preflight

      - name: Pack and clean-install tarball
        if: steps.scope.outputs.substantive == 'true'
        run: node scripts/verify-packed-consumer.mjs

      - name: Inspect packed artifact
        if: steps.scope.outputs.substantive == 'true'
        run: npm pack --dry-run --ignore-scripts

      - name: Adopt wiki-only main descendants
        if: steps.scope.outputs.substantive == 'true'
        env:
          QUALITY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          latest="$(git rev-parse origin/main)"
          if [ "$latest" = "$QUALITY_HEAD_SHA" ]; then exit 0; fi
          git merge-base --is-ancestor "$QUALITY_HEAD_SHA" "$latest" || {
            echo 'main no longer descends from the tested revision.' >&2; exit 1;
          }
          while IFS= read -r path; do
            case "$path" in
              wiki/*|scripts/graph/data/graph.json) ;;
              *) echo "Untested main change blocks release: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$QUALITY_HEAD_SHA" "$latest")
          git checkout --detach "$latest"

      - name: Record pre-release revision
        id: before
        if: steps.scope.outputs.substantive == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish, tag, changelog, and GitHub release
        if: steps.scope.outputs.substantive == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUSKY: '0'
        run: pnpm exec semantic-release

      - name: Detect a published release
        id: released
        if: steps.scope.outputs.substantive == 'true'
        env:
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
        run: |
          # @semantic-release/git commits the release, so HEAD moves only when a version was published.
          if [ "$(git rev-parse HEAD)" != "$BEFORE_SHA" ]; then echo 'published=true' >> "$GITHUB_OUTPUT"; fi

      - name: Wait for the release on the npm registry
        if: steps.released.outputs.published == 'true'
        timeout-minutes: 12
        continue-on-error: true
        run: |
          # npm accepts the upload minutes before the registry serves it, and the tarball can lag the packument.
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const { name, version } = JSON.parse(await readFile('package.json', 'utf8'));
          const url = `https://registry.npmjs.org/${name.replace('/', '%2F')}`;
          for (let attempt = 1; attempt <= 40; attempt++) {
            try {
              const response = await fetch(url);
              const tarball = response.ok && (await response.json()).versions?.[version]?.dist?.tarball;
              if (tarball && (await fetch(tarball, { method: 'HEAD' })).ok) {
                console.log(`${name}@${version} and its tarball are on the registry after ${attempt} check(s).`);
                process.exit(0);
              }
            } catch (error) {
              console.log(`Registry check ${attempt} failed: ${error.message}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 15_000));
          }
          console.log(`::warning::${name}@${version} and its tarball are not on the registry after 10 minutes; dispatching anyway.`);
          EOF

      - name: Mint Pin Courier token
        id: courier
        if: steps.released.outputs.published == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: JFusco
          repositories: renovate-config
          permission-contents: write

      - name: Notify the Renovate runner
        if: steps.released.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.courier.outputs.token }}
        run: gh api --method POST repos/JFusco/renovate-config/dispatches -f event_type=package-released
